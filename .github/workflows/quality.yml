name: Quality

on:
  workflow_call:
    inputs:
      upload_dist:
        description: Upload validated macOS release archives for a caller
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check build contract
        run: ./scripts/check-build-contract.sh
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Validate installer
        run: sh -n install.sh
      - name: Build and validate Apple Silicon and Intel archives
        run: make dist
      - name: Upload validated release archives
        if: inputs.upload_dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dist
          path: |
            dist/grok-build-proxy_Darwin_arm64.tar.gz
            dist/grok-build-proxy_Darwin_amd64.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1
