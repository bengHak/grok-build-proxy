name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-14
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: 1.88.0
      - name: Verify tag and Cargo package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "grok-build-proxy"))')"
          expected="v${version}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo package version ${expected}" >&2
            exit 1
          fi
          echo "tag=${expected}" >> "${GITHUB_OUTPUT}"
      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GH_REPO}/releases/tags/${TAG}" \
            --jq '.id' 2>release-query-error.log)" || {
              query_status=$?
              if [[ "${query_status}" == "1" ]] && grep -Fq 'HTTP 404' release-query-error.log; then
                cat release-query-error.log >&2
                release_id=""
              else
                cat release-query-error.log >&2
                exit "${query_status}"
              fi
            }
          rm -f release-query-error.log
          if [[ -n "${release_id}" ]]; then
            echo "Release ${TAG} already exists; refusing to replace published assets." >&2
            exit 1
          fi

  quality:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    with:
      upload_dist: true

  publish:
    needs: [preflight, quality]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-dist
          path: dist
      - name: Validate downloaded release archives
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            dist/grok-build-proxy_Darwin_arm64.tar.gz
            dist/grok-build-proxy_Darwin_amd64.tar.gz
            dist/checksums.txt
          )
          for path in "${expected[@]}"; do
            [[ -f "${path}" ]] || { echo "Missing release asset: ${path}" >&2; exit 1; }
          done
          [[ "$(find dist -type f | wc -l | tr -d ' ')" == "3" ]] || {
            echo "Unexpected files in downloaded release artifact" >&2
            find dist -type f -print >&2
            exit 1
          }
          expected_checksum_files=(
            grok-build-proxy_Darwin_arm64.tar.gz
            grok-build-proxy_Darwin_amd64.tar.gz
          )
          expected_checksums="$(printf '%s\n' "${expected_checksum_files[@]}" | LC_ALL=C sort)"
          actual_checksums="$(awk 'NF == 2 && $1 ~ /^[0-9a-f]{64}$/ { print $2 }' dist/checksums.txt | LC_ALL=C sort)"
          [[ "$(wc -l < dist/checksums.txt | tr -d ' ')" == "${#expected_checksum_files[@]}" && "${actual_checksums}" == "${expected_checksums}" ]] || {
            echo "checksums.txt must cover exactly the Apple Silicon and Intel archives" >&2
            exit 1
          }
          (cd dist && shasum -a 256 -c checksums.txt)
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            dist/grok-build-proxy_Darwin_arm64.tar.gz \
            dist/grok-build-proxy_Darwin_amd64.tar.gz \
            dist/checksums.txt \
            --generate-notes \
            --latest \
            --title "${TAG}" \
            --verify-tag
